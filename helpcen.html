<!DOCTYPE html>
<html lang="en">
    <head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="helpcen.css" rel="stylesheet">
    <title>Help Center</title>
</head>
<body>
    <section class="help center7">
        <div class="container">
            <div class="help-center">
             <h1>
                Help Center
             </h1>
             <h2>Hi, Traveler</h2>
             <div class="ask input">
<input class="form-control" list="datalistOptions" id="exampleDataList" placeholder="Ask">
<datalist id="datalistOptions">
  <option value="Stays">
  <option value="Loyalty & Rewards">
  <option value="Security">
  <option value="Things to do">
  <option value="Refunds & Charges">
     <option value="Account">
      <option value="Privacy">
         <option value="Travel Alerts">
      </option>
</datalist>
                <button class="button" id="searchBtn">
                    <i class="bi bi-search"></i>
                    search
                </button>
             </div>
            </div>
            <div class="Explore-articles">
  <h2>Explore help articles</h2>
  <div class="help-grid">
    <a href="#" class="help-item">
      <span class="icon">
        <i class="bi bi-house-door"></i></span>
      <span class="label">Stays</span>
      <span class="arrow"><i class="bi bi-chevron-right"></i></span>
    </a>
    <a href="#" class="help-item">
      <span class="icon"><i class="bi bi-trophy-fill"></i></span>
      <span class="label">Loyalty & Rewards</span>
       <span class="arrow"><i class="bi bi-chevron-right"></i></span>
    </a>
  <a href="#" class="help-item">
      <span class="icon"><i class="bi bi-shield-lock"></i></span>
      <span class="label">Security</span>
       <span class="arrow"><i class="bi bi-chevron-right"></i></span>
    </a>
 <a href="#" class="help-item">
      <span class="icon"><i class="bi bi-stars"></i></span>
      <span class="label">Things to do</span>
       <span class="arrow"><i class="bi bi-chevron-right"></i></span>
    </a>
     <a href="#" class="help-item">
      <span class="icon"><i class="bi bi-credit-card"></i></span>
      <span class="label">Refunds & Charges</span>
       <span class="arrow"><i class="bi bi-chevron-right"></i></span>
     </a>
     <a href="account.html" class="help-item">
      <span class="icon"><i class="bi bi-person"></i></span>
      <span class="label">Account</span>
       <span class="arrow"><i class="bi bi-chevron-right"></i></span>
    </a>
  <a href="#" class="help-item">
      <span class="icon"><i class="bi bi-lock"></i></span>
      <span class="label">Privacy</span>
       <span class="arrow"><i class="bi bi-chevron-right"></i></span>
    </a>
    <a href="#" class="help-item">
      <span class="icon"><i class="bi bi-exclamation-triangle-fill"></i></span>
      <span class="label">Travel Alerts</span>
       <span class="arrow"><i class="bi bi-chevron-right"></i></span>
    </a>
  </div>
</div>
        </div>
    </section>

</html>
